name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: thiscafeteria_test
          POSTGRES_USER: test_only
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_only -d thiscafeteria_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_POSTGRES_CONNECTION: Host=127.0.0.1;Port=5432;Database=thiscafeteria_test;Username=test_only;Password=test_only_password

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Verify trained homepage policy
        run: node tools/verify_pixel_crew.mjs

      - name: Test EVM contracts
        working-directory: contracts/evm
        run: npm ci && npm test

      - name: Test agent gateway
        working-directory: src/ThisCafeteria.AgentGateway
        run: npm ci && npm test && npm run build

      - name: Test Solana program logic
        run: cargo test --manifest-path contracts/solana/Cargo.toml --locked

      - name: Test Solana Wallet Standard adapters
        working-directory: contracts/solana
        run: npm ci && npm run test:browser

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

  crossstack-verification:
    name: Cross-stack live verification (sponsorship, bundler, cross-chain solver)
    runs-on: ubuntu-latest
    needs: build-test
    # Deliberately not a dependency of deploy-azure: this job drives live Hardhat nodes, a
    # downloaded external bundler binary, and a real standing worker process, all of which carry
    # more inherent timing/flakiness risk than the unit/contract suites in build-test. It verifies
    # real cross-stack behavior that no unit test can (see docs/agentic-commerce-stack-plan.md and
    # walkthrough.md for what each proof script actually establishes), but gating production
    # deploys on it is a separate decision this job does not make unilaterally.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: thiscafeteria_test
          POSTGRES_USER: test_only
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_only -d thiscafeteria_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=thiscafeteria_test;Username=test_only;Password=test_only_password

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore and build
        run: dotnet restore && dotnet build --configuration Release --no-restore

      - name: Restore local dotnet tools (dotnet-ef)
        run: dotnet tool restore

      - name: Install contract dependencies
        working-directory: contracts/evm
        run: npm ci

      # --- Stage 1: sponsorship, gas-simulation, and bundler proofs (single node, port 8546) ---

      - name: Start Hardhat node (arbitrumLocal)
        working-directory: contracts/evm
        run: nohup npx hardhat node --network hardhat --port 8546 > /tmp/hardhat-8546.log 2>&1 &

      - name: Wait for Hardhat node RPC
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf -X POST -H "Content-Type: application/json" \
                --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
                http://127.0.0.1:8546 > /dev/null; then
              echo "Hardhat node ready."
              exit 0
            fi
            echo "Waiting for Hardhat node (attempt $i/30)..."
            sleep 2
          done
          echo "ERROR: Hardhat node did not start within 60 seconds." >&2
          cat /tmp/hardhat-8546.log >&2
          exit 1

      - name: Deploy contracts to arbitrumLocal
        working-directory: contracts/evm
        run: npx hardhat run scripts/deploy.ts --network arbitrumLocal

      - name: Run crossstack sponsor check (real C# UserOperationSponsor/UserOperationSimulator)
        working-directory: contracts/evm
        run: HARDHAT_NETWORK=arbitrumLocal npx tsx scripts/crossstack-sponsor-check.ts

      - name: Run simulation recipe check
        working-directory: contracts/evm
        run: HARDHAT_NETWORK=arbitrumLocal npx tsx scripts/simulation-recipe-check.ts

      - name: Download Rundler v0.11.0 (pinned release binary, not npm-distributed)
        run: |
          set -euo pipefail
          mkdir -p /tmp/rundler
          curl -sL -o /tmp/rundler.tar.gz \
            "https://github.com/alchemyplatform/rundler/releases/download/v0.11.0/rundler-v0.11.0-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/rundler.tar.gz -C /tmp/rundler
          chmod +x /tmp/rundler/rundler

      - name: Start Rundler bundler in --unsafe mode (local Hardhat can't run bundler safe-mode's JS tracer; see "Rundler investigation" in agentic-commerce-stack-plan.md)
        run: |
          nohup /tmp/rundler/rundler node \
            --chain_spec contracts/evm/scripts/rundler-chain-spec-local.toml \
            --node_http http://127.0.0.1:8546 \
            --signer.private_keys 0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d \
            --rpc.port 4338 \
            --unsafe \
            > /tmp/rundler.log 2>&1 &

      - name: Wait for Rundler RPC
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf -X POST -H "Content-Type: application/json" \
                --data '{"jsonrpc":"2.0","method":"eth_supportedEntryPoints","params":[],"id":1}' \
                http://127.0.0.1:4338 > /dev/null; then
              echo "Rundler ready."
              exit 0
            fi
            echo "Waiting for Rundler (attempt $i/30)..."
            sleep 2
          done
          echo "ERROR: Rundler did not start within 60 seconds." >&2
          cat /tmp/rundler.log >&2
          exit 1

      - name: Run Rundler end-to-end bundler check
        working-directory: contracts/evm
        run: HARDHAT_NETWORK=arbitrumLocal npx tsx scripts/rundler-e2e-check.ts

      - name: Stop stage 1 processes
        if: always()
        run: |
          pkill -9 -f "rundler node" || true
          pkill -9 -f "hardhat node" || true
          sleep 2

      # --- Stage 2: two-node cross-chain smoke test and standing solver (two nodes, 8546+8547) ---

      - name: Start two independent Hardhat nodes (arbitrumLocal, baseLocal)
        working-directory: contracts/evm
        run: |
          nohup npx hardhat node --network hardhat --port 8546 > /tmp/hardhat-8546-b.log 2>&1 &
          nohup npx hardhat node --network hardhat --port 8547 > /tmp/hardhat-8547.log 2>&1 &

      - name: Wait for both Hardhat node RPCs
        run: |
          set -euo pipefail
          for port in 8546 8547; do
            for i in $(seq 1 30); do
              if curl -sf -X POST -H "Content-Type: application/json" \
                  --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
                  "http://127.0.0.1:${port}" > /dev/null; then
                echo "Hardhat node on port ${port} ready."
                break
              fi
              if [ "$i" = "30" ]; then
                echo "ERROR: Hardhat node on port ${port} did not start within 60 seconds." >&2
                exit 1
              fi
              sleep 2
            done
          done

      - name: Run two-node cross-chain smoke test (Phase 5 gate)
        working-directory: contracts/evm
        run: npx tsx scripts/two-node-crosschain-smoke.ts

      - name: Apply database migrations
        run: |
          dotnet ef database update \
            --project src/ThisCafeteria.Infrastructure \
            --startup-project src/ThisCafeteria.Web

      - name: Deploy standing-solver fixtures
        working-directory: contracts/evm
        run: HARDHAT_NETWORK=arbitrumLocal npx tsx scripts/two-node-standing-solver-check.ts --deploy

      - name: Start ThisCafeteria.Worker (real standing CrossChainSolverWorker BackgroundService)
        run: |
          set -euo pipefail
          STATE=/tmp/standing-solver-state.json
          read_field() { node -e "process.stdout.write(String(require('$STATE').$1))"; }

          export Blockchain__DefaultChainKey=arbitrumLocal
          export Blockchain__Chains__0__Key=arbitrumLocal
          export Blockchain__Chains__0__Family=Evm
          export Blockchain__Chains__0__EvmChainId=421614
          export Blockchain__Chains__0__EvmChainIdHex=0x66eee
          export Blockchain__Chains__0__PublicRpcUrl=http://127.0.0.1:8546
          export Blockchain__Chains__0__Enabled=true
          export Blockchain__Chains__1__Key=baseLocal
          export Blockchain__Chains__1__Family=Evm
          export Blockchain__Chains__1__EvmChainId=84532
          export Blockchain__Chains__1__EvmChainIdHex=0x14a34
          export Blockchain__Chains__1__PublicRpcUrl=http://127.0.0.1:8547
          export Blockchain__Chains__1__Enabled=true
          export CrossChainSolver__Enabled=true
          export CrossChainSolver__SourceChainKey=arbitrumLocal
          export CrossChainSolver__SourceResolverAddress=$(read_field sourceResolver)
          export CrossChainSolver__DestinationChainKey=baseLocal
          export CrossChainSolver__DestinationResolverAddress=$(read_field destResolver)
          export CrossChainSolver__SolverPrivateKey=$(read_field solverPrivateKey)
          export CrossChainSolver__AllowedTokenPairs__0__SourceToken=$(read_field sourceToken)
          export CrossChainSolver__AllowedTokenPairs__0__DestinationToken=$(read_field destToken)
          export CrossChainSolver__MaxAmountIn=1000
          export CrossChainSolver__MaxOutputBps=10000

          nohup dotnet run --project src/ThisCafeteria.Worker --environment Development \
            --configuration Release --no-build \
            > /tmp/worker.log 2>&1 &
          echo "Worker starting, waiting 10s to initialize..."
          sleep 10
          cat /tmp/worker.log

      - name: Submit policy-approved intent and verify autonomous fill
        working-directory: contracts/evm
        run: HARDHAT_NETWORK=arbitrumLocal npx tsx scripts/two-node-standing-solver-check.ts --submit-good

      - name: Submit disallowed-token-pair intent and verify it stays unfilled
        working-directory: contracts/evm
        run: HARDHAT_NETWORK=arbitrumLocal npx tsx scripts/two-node-standing-solver-check.ts --submit-denied

      - name: Show worker log
        if: always()
        run: cat /tmp/worker.log || true

      - name: Stop stage 2 processes
        if: always()
        run: |
          pkill -9 -f "ThisCafeteria.Worker" || true
          pkill -9 -f "hardhat node" || true

  deploy-azure:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: [build-test, crossstack-verification]
    # Live traffic is Atlantic.Net (`docs/atlantic-migration.md`), not Azure.
    # Keep this job as an opt-in leftover until the Azure subscription is deleted.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_AZURE_DEPLOY == 'true'
    environment: production
    concurrency:
      group: production-deploy
      # Never interrupt a production run after it may have applied migrations.
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    env:
      RESOURCE_GROUP: thiscafeteria-prod-rg
      ACR_NAME: thiscafeteriaprodacr3m7beebrmubaa
      WEB_APP_NAME: thiscafeteria-prod-web
      WORKER_APP_NAME: thiscafeteria-prod-worker
      POSTGRES_SERVER_NAME: thiscafeteria-prod-pg-3m7beebrmubaa
      KEY_VAULT_NAME: tc-kv-3m7beebrmubaa
      IMAGE_TAG: ${{ github.sha }}
      FIREWALL_RULE_NAME: github-actions-runner-temp

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify deployment scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "web_changed=true" >> "$GITHUB_OUTPUT"
            echo "worker_changed=true" >> "$GITHUB_OUTPUT"
            echo "hero_expected=$(test -f src/ThisCafeteria.Web/Components/Home/PixelHome.razor && echo true || echo false)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          printf '%s\n' "$CHANGED_FILES"

          if grep -Eq '^(src/ThisCafeteria.Web/|src/ThisCafeteria.Domain/|src/ThisCafeteria.Application/|src/ThisCafeteria.Infrastructure/|deployments/|Directory.Build.props$|global.json$)' <<< "$CHANGED_FILES"; then
            echo "web_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "web_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(src/ThisCafeteria.Worker/|src/ThisCafeteria.Domain/|src/ThisCafeteria.Application/|src/ThisCafeteria.Infrastructure/|deployments/|Directory.Build.props$|global.json$)' <<< "$CHANGED_FILES"; then
            echo "worker_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "worker_changed=false" >> "$GITHUB_OUTPUT"
          fi

          echo "hero_expected=$(test -f src/ThisCafeteria.Web/Components/Home/PixelHome.razor && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CICD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Capture currently deployed images
        id: previous
        shell: bash
        run: |
          set -uo pipefail
          # az containerapp show has been observed to fail silently (no stdout, no
          # stderr, just a bare non-zero exit ~3-4s in) against this subscription -
          # consistent with a transient ARM control-plane blip rather than a real
          # auth/not-found error, which always prints text. Retry with backoff and
          # capture --debug output on failure so a *persistent* failure (bad
          # credentials, renamed/deleted app) is actually diagnosable from the log
          # instead of showing up as a bare "exit code 1".
          fetch_image() {
            local app_name="$1" attempt image debug_log
            for attempt in 1 2 3 4 5; do
              debug_log=$(mktemp)
              if image=$(az containerapp show \
                --name "$app_name" \
                --resource-group "$RESOURCE_GROUP" \
                --query "properties.template.containers[0].image" -o tsv \
                2>"$debug_log"); then
                if [[ -n "$image" ]]; then
                  rm -f "$debug_log"
                  echo "$image"
                  return 0
                fi
                echo "::warning::az containerapp show '$app_name' returned an empty image (attempt $attempt/5)" >&2
              else
                echo "::warning::az containerapp show '$app_name' failed (attempt $attempt/5), exit $?:" >&2
                cat "$debug_log" >&2
              fi
              rm -f "$debug_log"
              sleep $((attempt * 5))
            done
            echo "::error::az containerapp show '$app_name' failed after 5 attempts" >&2
            return 1
          }

          WEB_IMAGE=$(fetch_image "$WEB_APP_NAME") || exit 1
          WORKER_IMAGE=$(fetch_image "$WORKER_APP_NAME") || exit 1
          echo "web_image=$WEB_IMAGE" >> "$GITHUB_OUTPUT"
          echo "worker_image=$WORKER_IMAGE" >> "$GITHUB_OUTPUT"
          echo "Rollback images captured."

      # ACR Tasks (az acr build) is not permitted on Azure for Students
      # subscriptions (TasksOperationsNotAllowed), so images are built on the
      # runner and pushed with docker instead.
      - name: Log in to ACR
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"

      - name: Build and push Web image to ACR
        if: steps.scope.outputs.web_changed == 'true'
        run: |
          set -euo pipefail
          docker build \
            --file src/ThisCafeteria.Web/Dockerfile \
            --tag "$ACR_NAME.azurecr.io/thiscafeteria-web:$IMAGE_TAG" \
            .
          docker push "$ACR_NAME.azurecr.io/thiscafeteria-web:$IMAGE_TAG"

      - name: Build and push Worker image to ACR
        if: steps.scope.outputs.worker_changed == 'true'
        run: |
          set -euo pipefail
          docker build \
            --file src/ThisCafeteria.Worker/Dockerfile \
            --tag "$ACR_NAME.azurecr.io/thiscafeteria-worker:$IMAGE_TAG" \
            .
          docker push "$ACR_NAME.azurecr.io/thiscafeteria-worker:$IMAGE_TAG"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      # dotnet ef builds the startup project; without a restore the assets
      # files are missing on a fresh runner (NETSDK1004).
      - name: Restore NuGet packages
        run: dotnet restore src/ThisCafeteria.Web

      - name: Allow runner IP through Postgres firewall
        run: |
          set -euo pipefail
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "Allowing runner IP $RUNNER_IP through the Postgres firewall temporarily"
          az postgres flexible-server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" \
            --server-name "$POSTGRES_SERVER_NAME" \
            --name "$FIREWALL_RULE_NAME" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP" \
            --output none

      - name: Run EF Core migrations
        run: |
          set -euo pipefail
          export ConnectionStrings__DefaultConnection=$(az keyvault secret show \
            --vault-name "$KEY_VAULT_NAME" \
            --name db-connection-string \
            --query value -o tsv)
          dotnet ef database update \
            --project src/ThisCafeteria.Infrastructure \
            --startup-project src/ThisCafeteria.Web \
            --configuration Release

      - name: Remove runner IP from Postgres firewall
        if: always()
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "$RESOURCE_GROUP" \
            --server-name "$POSTGRES_SERVER_NAME" \
            --name "$FIREWALL_RULE_NAME" \
            --yes || true

      - name: Update Web Container App
        if: steps.scope.outputs.web_changed == 'true'
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$WEB_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/thiscafeteria-web:$IMAGE_TAG" \
            --min-replicas 1 \
            --max-replicas 2 \
            --output none

      - name: Wait for Web app health
        id: web_health
        if: steps.scope.outputs.web_changed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          WEB_FQDN=$(az containerapp show \
            --name "$WEB_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          for attempt in $(seq 1 30); do
            if curl --fail --show-error --silent "https://$WEB_FQDN/health/ready" >/dev/null \
              && curl --fail --show-error --silent "https://$WEB_FQDN/_framework/blazor.web.js" >/dev/null; then
              if [[ "${{ steps.scope.outputs.hero_expected }}" == "true" ]]; then
                HOME_HTML=$(curl --fail --show-error --silent "https://$WEB_FQDN/")
                if ! grep -q 'class="ph-hero' <<< "$HOME_HTML" \
                  || ! grep -q 'id="ph-scene-root"' <<< "$HOME_HTML"; then
                  echo "App is healthy, but the pixel homepage release contract is missing."
                  sleep 5
                  continue
                fi
              fi
              echo "App healthy, serving Blazor, and matching the homepage release contract on attempt ${attempt}"
              exit 0
            fi
            echo "App not ready (attempt ${attempt}/30), retrying in 5s..."
            sleep 5
          done
          echo "App did not become healthy (health + blazor.web.js) within 150 seconds." >&2
          exit 1

      - name: Roll back Web after failed health check
        if: steps.scope.outputs.web_changed == 'true' && steps.web_health.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "Rolling Web back to ${{ steps.previous.outputs.web_image }}"
          az containerapp update \
            --name "$WEB_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${{ steps.previous.outputs.web_image }}" \
            --min-replicas 1 \
            --max-replicas 2 \
            --output none

      - name: Fail deployment after Web rollback
        if: steps.scope.outputs.web_changed == 'true' && steps.web_health.outcome == 'failure'
        run: |
          echo "The candidate Web image failed health checks and was rolled back." >&2
          exit 1

      - name: Update Worker Container App
        id: deploy_worker
        if: steps.scope.outputs.worker_changed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$WORKER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/thiscafeteria-worker:$IMAGE_TAG" \
            --min-replicas 1 \
            --max-replicas 1 \
            --output none

      - name: Roll back release after failed Worker update
        if: steps.scope.outputs.worker_changed == 'true' && steps.deploy_worker.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "Rolling Worker back to ${{ steps.previous.outputs.worker_image }}"
          az containerapp update \
            --name "$WORKER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${{ steps.previous.outputs.worker_image }}" \
            --min-replicas 1 \
            --max-replicas 1 \
            --output none
          if [[ "${{ steps.scope.outputs.web_changed }}" == "true" ]]; then
            echo "Rolling Web back to ${{ steps.previous.outputs.web_image }} to keep the release atomic"
            az containerapp update \
              --name "$WEB_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "${{ steps.previous.outputs.web_image }}" \
              --min-replicas 1 \
              --max-replicas 2 \
              --output none
          fi

      - name: Fail deployment after Worker rollback
        if: steps.scope.outputs.worker_changed == 'true' && steps.deploy_worker.outcome == 'failure'
        run: |
          echo "The candidate Worker image failed to deploy and the release was rolled back." >&2
          exit 1

      # infra/main.bicepparam deliberately points routine IaC reconciliations at
      # :latest. Move that mutable tag only after every affected app is healthy;
      # otherwise an infra-only Bicep apply could resurrect a failed candidate
      # even though the Container App itself had already rolled back to a SHA.
      - name: Promote healthy images to latest
        run: |
          set -euo pipefail
          if [[ "${{ steps.scope.outputs.web_changed }}" == "true" ]]; then
            docker tag \
              "$ACR_NAME.azurecr.io/thiscafeteria-web:$IMAGE_TAG" \
              "$ACR_NAME.azurecr.io/thiscafeteria-web:latest"
            docker push "$ACR_NAME.azurecr.io/thiscafeteria-web:latest"
          fi
          if [[ "${{ steps.scope.outputs.worker_changed }}" == "true" ]]; then
            docker tag \
              "$ACR_NAME.azurecr.io/thiscafeteria-worker:$IMAGE_TAG" \
              "$ACR_NAME.azurecr.io/thiscafeteria-worker:latest"
            docker push "$ACR_NAME.azurecr.io/thiscafeteria-worker:latest"
          fi
