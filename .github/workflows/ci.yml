name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

  deploy-azure:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: production-deploy
      cancel-in-progress: true

    permissions:
      id-token: write
      contents: read

    env:
      RESOURCE_GROUP: thiscafeteria-prod-rg
      ACR_NAME: thiscafeteriaprodacr3m7beebrmubaa
      WEB_APP_NAME: thiscafeteria-prod-web
      WORKER_APP_NAME: thiscafeteria-prod-worker
      POSTGRES_SERVER_NAME: thiscafeteria-prod-pg-3m7beebrmubaa
      KEY_VAULT_NAME: tc-kv-3m7beebrmubaa
      IMAGE_TAG: ${{ github.sha }}
      FIREWALL_RULE_NAME: github-actions-runner-temp

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CICD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ACR Tasks (az acr build) is not permitted on Azure for Students
      # subscriptions (TasksOperationsNotAllowed), so images are built on the
      # runner and pushed with docker instead.
      - name: Log in to ACR
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"

      - name: Build and push Web image to ACR
        run: |
          set -euo pipefail
          docker build \
            --file src/ThisCafeteria.Web/Dockerfile \
            --tag "$ACR_NAME.azurecr.io/thiscafeteria-web:$IMAGE_TAG" \
            --tag "$ACR_NAME.azurecr.io/thiscafeteria-web:latest" \
            .
          docker push --all-tags "$ACR_NAME.azurecr.io/thiscafeteria-web"

      - name: Build and push Worker image to ACR
        run: |
          set -euo pipefail
          docker build \
            --file src/ThisCafeteria.Worker/Dockerfile \
            --tag "$ACR_NAME.azurecr.io/thiscafeteria-worker:$IMAGE_TAG" \
            --tag "$ACR_NAME.azurecr.io/thiscafeteria-worker:latest" \
            .
          docker push --all-tags "$ACR_NAME.azurecr.io/thiscafeteria-worker"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      # dotnet ef builds the startup project; without a restore the assets
      # files are missing on a fresh runner (NETSDK1004).
      - name: Restore NuGet packages
        run: dotnet restore src/ThisCafeteria.Web

      - name: Allow runner IP through Postgres firewall
        run: |
          set -euo pipefail
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "Allowing runner IP $RUNNER_IP through the Postgres firewall temporarily"
          az postgres flexible-server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" \
            --server-name "$POSTGRES_SERVER_NAME" \
            --name "$FIREWALL_RULE_NAME" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP" \
            --output none

      - name: Run EF Core migrations
        run: |
          set -euo pipefail
          export ConnectionStrings__DefaultConnection=$(az keyvault secret show \
            --vault-name "$KEY_VAULT_NAME" \
            --name db-connection-string \
            --query value -o tsv)
          dotnet ef database update \
            --project src/ThisCafeteria.Infrastructure \
            --startup-project src/ThisCafeteria.Web \
            --configuration Release

      - name: Remove runner IP from Postgres firewall
        if: always()
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "$RESOURCE_GROUP" \
            --server-name "$POSTGRES_SERVER_NAME" \
            --name "$FIREWALL_RULE_NAME" \
            --yes || true

      - name: Update Web Container App
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$WEB_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/thiscafeteria-web:$IMAGE_TAG" \
            --output none

      - name: Update Worker Container App
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$WORKER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/thiscafeteria-worker:$IMAGE_TAG" \
            --output none

      - name: Wait for Web app health
        run: |
          set -euo pipefail
          WEB_FQDN=$(az containerapp show \
            --name "$WEB_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          for attempt in $(seq 1 30); do
            if curl --fail --show-error --silent "https://$WEB_FQDN/health" >/dev/null \
              && curl --fail --show-error --silent "https://$WEB_FQDN/_framework/blazor.web.js" >/dev/null; then
              echo "App healthy and serving blazor.web.js on attempt ${attempt}"
              exit 0
            fi
            echo "App not ready (attempt ${attempt}/30), retrying in 5s..."
            sleep 5
          done
          echo "App did not become healthy (health + blazor.web.js) within 150 seconds." >&2
          exit 1
